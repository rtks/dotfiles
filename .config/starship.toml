add_newline = false
command_timeout = 5000

# Which is equivalent to
format = """
${env_var.FISH_PROMPT_EXTRA}\
$username\
$hostname\
$localip\
$os\
$container\
$netns\
$shell\
$shlvl\
$singularity\
$kubernetes\
$directory\
$vcsh\
$fossil_branch\
$fossil_metrics\
(\\($vcs\\) )\
$hg_branch\
$pijul_channel\
$sudo\
$cmd_duration\
$jobs\
$battery\
$time\
$status\
$character"""

# jj と git のどちらを出すかは vcs モジュールが決める（jj 優先）。
# status は遅延で求めて FISH_PROMPT_VCS に入る（fish_prompt が starship_status.toml で求める）
[vcs]
order = ["jj", "git"]
jj_modules = '$jj_bookmark${env_var.FISH_PROMPT_VCS}'
git_modules = '$git_branch$git_commit${env_var.FISH_PROMPT_VCS}$git_state'

[username]
disabled = true

[battery]
disabled = true

[hostname]
format = "[$hostname]($style) "
style = "bright black"
detect_env_vars = ['!TMUX', '!VSCODE_INJECTION']

[container]
format = '[$symbol $name]($style) '

[shell]
disabled = false
format = '[$indicator]($style)'
style = 'blue'
fish_indicator = ''
bash_indicator = 'bash '
zsh_indicator = 'zsh '
powershell_indicator = 'PS '

[directory]
style = "green"
fish_style_pwd_dir_length = 1

[git_branch]
format = '[$branch]($style)'
style = "green"

[git_commit]
format = '[\($hash$tag\)]($style)'
style = "green"

[git_state]
format = '(|[$state($progress_current/$progress_total)]($style))'
style = "bright-black"

[jj_bookmark]
format = '[$bookmark(@$remote)$diverged]($style)'
style = "green"

[character]
success_symbol = "[>](black)"
error_symbol = "[>](bold red)"
vimcmd_symbol = "[>](green)"

[cmd_duration]
format = "[$duration]($style) "
style = "yellow"
min_time = 500

[status]
disabled = false
format = '[$status(\($common_meaning$signal_name\))]($style) '
pipestatus = true
pipestatus_separator = ""
pipestatus_format = '$pipestatus'

[env_var.FISH_PROMPT_VCS]
format = '[$env_value](black)'

[env_var.FISH_PROMPT_EXTRA]
format = "[$env_value](black)\n"